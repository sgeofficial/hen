<!DOCTYPE html>
<html lang="id" manifest="navigation.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SUPER GAMES ELEKTRONIK | PS4 5.05–13.52 FW Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #020612 url('bg-loading.png') center center / 100% 100% no-repeat fixed;
      color: #eef5ff; font-family: Arial, Helvetica, sans-serif;
    }
    #pc-block {
      display: none; position: fixed; inset: 0; z-index: 999999;
      background: #0b0e14; align-items: center; justify-content: center;
    }
    #pc-block .box {
      background: #141821; border: 1px solid #2b3240; border-radius: 16px;
      padding: 36px 44px; max-width: 580px; width: 90%; text-align: center;
    }
    #pc-block h2 { color: #ff4d4d; font-size: 22px; margin-bottom: 18px; }
    #pc-block pre {
      background: #0d1017; border: 1px solid #252b38; border-radius: 10px;
      padding: 14px; text-align: left; font-size: 13px; color: #94a3b8;
      white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="pc-block">
    <div class="box">
      <h2>&#10060; Perangkat ini bukan PlayStation 4.</h2>
      <pre id="ua-display"></pre>
    </div>
  </div>
  <script>
    (function() {
      var ua = navigator.userAgent;
      if (!/PlayStation 4/i.test(ua)) {
        document.getElementById('pc-block').style.display = 'flex';
        document.getElementById('ua-display').textContent = "User-Agent Terdeteksi:\n" + ua;
        return;
      }
      var match = ua.match(/PlayStation 4\/([0-9]+\.[0-9]+)/i);
      var fw = match ? parseFloat(match) : 9.00;
      var targetUrl = "900/index5.html";
      if (fw === 5.05) targetUrl = "505/index.html";
      else if (fw === 6.72) targetUrl = "672/index.html";
      else if (fw >= 7.00 && fw <= 8.52) targetUrl = "700/index.html";
      else if (fw >= 9.00 && fw <= 9.60) targetUrl = "900/index5.html";
      else if (fw >= 11.00 && fw <= 13.00) targetUrl = "1300/index.html";
      else if (fw >= 13.02) targetUrl = "1352/index.html";

      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
